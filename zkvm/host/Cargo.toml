[package]
name = 'zkvm_host'
edition = { workspace = true }
authors = ["Grandine <info@grandine.io>"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
bls = { workspace = true, features = ['zkcrypto', 'zkvm'] }
bonsai-sdk = { workspace = true }
borsh = { workspace = true }
clap = { workspace = true, features = ['derive'] }
hex = { workspace = true }
ssz = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
regex = { workspace = true }
risc0-zkvm = { workspace = true, optional = true }
sp1-sdk = { workspace = true, optional = true }
transition_functions = { workspace = true }
types = { workspace = true }
zkvm_guest_risc0 = { workspace = true, optional = true }

[build-dependencies]
sp1-helper = { workspace = true, optional = true }

[features]
risc0 = [
    "dep:risc0-zkvm",
    "dep:tracing-subscriber",
    "dep:zkvm_guest_risc0"
]
sp1 = [
    "dep:sp1-helper",
    "dep:sp1-sdk"
]